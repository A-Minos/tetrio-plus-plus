name: 构建

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2
      - run: |
          cd tetrio-plus-plus-customize
          bun install
          bun run build
          cd ..

      - run: ./scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          path: |
            tetrioplus.xpi
            app.asar.zip

      - uses: actions/upload-artifact@v4
        with:
          name: build-electron
          path: out

      - uses: actions/upload-artifact@v4
        with:
          name: build-firefox
          path: build